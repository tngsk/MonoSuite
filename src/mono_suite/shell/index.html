<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mono Suite</title>
  <link rel="stylesheet" href="/shell/style.css">
</head>
<body>
  <header id="header">
    <div class="header-left">
      <span class="brand">Mono</span>
      <span class="divider">/</span>
      <span id="file-name" class="filename">document.md</span>
    </div>

    <div class="header-center">
      <div class="view-switcher" role="group" aria-label="ビュー切り替え">
        <button id="btn-space" class="view-btn active" type="button">Space</button>
        <button id="btn-doc" class="view-btn" type="button">Doc</button>
      </div>
    </div>

    <div class="header-right">
      <button id="btn-export" class="export-btn" type="button" title="配布PDFを含む完全ビルドを実行します">
        <span id="export-label">Export PDF</span>
      </button>
      <span id="status-dot" class="status-dot" title="接続中"></span>
    </div>
  </header>

  <main id="viewport">
    <iframe id="frame-space" class="view-frame active" src="/space" title="Space Presentation View"></iframe>
    <iframe id="frame-doc" class="view-frame hidden" src="/doc" title="Doc Handout View"></iframe>
  </main>

  <script src="/shell/sync.js"></script>
</body>
</html>
