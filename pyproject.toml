[project]
name = "monosuite"
version = "1.0.0b1"
description = "Mono Suite - Integrated authoring environment for presentation and handout"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mono-space",
    "Mono",
]

[project.scripts]
mono = "mono_suite.cli:main"
mono-space = "mono_space.build:main"
mono-doc = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mono_suite"]

[tool.uv.workspace]
members = ["modules/*"]

[tool.uv.sources]
mono-space = { workspace = true }
Mono = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
]
