[project]
name = "mono-space"
version = "0.1.0"
description = "Mono Space - Spatial Markdown Presentation"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mono-space = "mono_space.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mono_space"]
