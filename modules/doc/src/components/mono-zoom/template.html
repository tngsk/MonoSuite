<template id="mono-zoom-template">
    <style>{COMPONENTS_CSS}</style>
    
    <!-- Zoom Trigger Button -->
    <button id="zoom-trigger" class="hidden" aria-label="Zoom in (Shortcut: Z)" title="Zoom (Z)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
    </button>

    <!-- Fullscreen Overlay -->
    <div id="zoom-overlay" class="hidden" role="dialog" aria-modal="true" tabindex="-1">
        <div id="zoom-content-wrapper">
            <button id="zoom-close" aria-label="Close zoom (Shortcut: Z or Esc)" title="Close (Z / Esc)">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div id="zoom-content"><slot></slot></div>
        </div>
    </div>
</template>
